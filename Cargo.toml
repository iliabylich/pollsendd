[package]
name = "pollsendd"
version = "0.3.0"
edition = "2024"
description = "A tiny utility library to write poll-based systemd services"
license = "MIT"
repository = "https://github.com/iliabylich/pollsendd"
authors = ["Ilya Bylich <ibylich@gmail.com>"]

[dependencies]
log = "0.4"
rustix = { version = "1.1", features = ["fs", "event", "net"] }
sd-listen-fds = "0.2"

[dev-dependencies]
rustix = { version = "1.1", features = ["time"] }
env_logger = { version = "0.11", default-features = false, features = [
    "auto-color",
] }
